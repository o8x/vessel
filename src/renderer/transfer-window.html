<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Vessel Transfer</title>
    <link rel="stylesheet" href="./styles/constants.css" />
    <link rel="stylesheet" href="./styles/tailwind.build.css" />
  </head>
  <body class="term-window file-window bg-transparent">
    <div class="flex h-full w-full flex-col overflow-hidden" style="background: var(--file-window-bg)">
      <!-- 模态标题栏（hiddenInset）：独占一行，显示窗口标题，红绿灯在左侧 -->
      <header class="modal-titlebar">
        <span id="transfer-window-title" class="modal-titlebar-title"></span>
      </header>
      <!-- 穿梭框：左 / 右两栏各一个 SSH 连接，中间是可拖动的竖直分隔线 -->
      <main class="flex min-h-0 flex-1">
        <section id="transfer-pane-left" class="transfer-pane-host"></section>
        <div id="transfer-divider" class="transfer-divider-v"></div>
        <section id="transfer-pane-right" class="transfer-pane-host"></section>
      </main>
      <footer class="fm-status">
        <span id="transfer-status-path" class="fm-status-path"></span>
        <div id="transfer-progress" class="fm-progress-stack hidden">
          <div class="fm-progress-row">
            <span id="transfer-progress-download-label" class="fm-progress-label"></span>
            <div class="fm-progress">
              <div id="transfer-progress-download-fill" class="fm-progress-fill"></div>
            </div>
          </div>
          <div class="fm-progress-row">
            <span id="transfer-progress-upload-label" class="fm-progress-label"></span>
            <div class="fm-progress">
              <div id="transfer-progress-upload-fill" class="fm-progress-fill"></div>
            </div>
          </div>
        </div>
        <span id="transfer-status-msg" class="fm-status-msg"></span>
      </footer>
    </div>

    <script src="./scripts/theme.js"></script>
    <script src="./scripts/constants.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script src="./scripts/ui.js"></script>
    <script src="./scripts/transfer-window.js"></script>
  </body>
</html>
