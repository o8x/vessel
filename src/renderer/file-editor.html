<!doctype html>
<html lang="zh" data-theme="light" data-theme-lock="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:"
    />
    <title>Vessel Editor</title>
    <link rel="stylesheet" href="../../node_modules/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="./styles/constants.css" />
    <link rel="stylesheet" href="./styles/tailwind.build.css" />
  </head>
  <body class="editor-window">
    <div class="editor-shell">
      <!-- 模态标题栏（hiddenInset）：独占一行，显示窗口标题（文件名 + 未保存标记），红绿灯在左侧 -->
      <header class="modal-titlebar">
        <span id="editor-window-title" class="modal-titlebar-title"></span>
      </header>
      <header class="editor-toolbar">
        <button id="ed-open" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-save" class="icon-btn editor-toolbar-btn primary" type="button"></button>
        <button id="ed-save-as" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-open-vscode" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-download" class="icon-btn editor-toolbar-btn" type="button"></button>
        <span class="editor-toolbar-spacer"></span>
        <button id="ed-preview" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-lines" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-wrap" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-undo" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-redo" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-reload" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-font-smaller" class="icon-btn editor-toolbar-btn" type="button">A−</button>
        <button id="ed-font-bigger" class="icon-btn editor-toolbar-btn" type="button">A+</button>
        <button id="ed-copy-image" class="icon-btn editor-toolbar-btn" type="button"></button>
        <button id="ed-more" class="icon-btn editor-toolbar-btn" type="button"></button>
      </header>
      <!-- 更多命令（跳转行 / 行操作 / 缩进 / 字号）：点工具栏最右侧「…」弹出 -->
      <div id="ed-menu" class="editor-menu" hidden></div>
      <!-- 查找 / 替换（Command + F）：停靠在工具栏下方，两行布局（查找 / 替换），风格接近 Word -->
      <div id="editor-find" class="editor-find" hidden>
        <div class="editor-find-row">
          <label class="editor-find-label" for="ed-find-input" id="ed-find-label"></label>
          <input id="ed-find-input" class="editor-find-input" type="text" spellcheck="false" autocomplete="off" />
          <span id="ed-find-count" class="editor-find-count"></span>
          <button id="ed-find-prev" class="icon-btn editor-find-btn" type="button"></button>
          <button id="ed-find-next" class="icon-btn editor-find-btn" type="button"></button>
          <button id="ed-find-case" class="icon-btn editor-find-btn editor-find-toggle" type="button" aria-pressed="false"></button>
          <button id="ed-find-regex" class="icon-btn editor-find-btn editor-find-toggle" type="button" aria-pressed="false">.*</button>
          <button id="ed-find-close" class="icon-btn editor-find-btn" type="button"></button>
        </div>
        <div class="editor-find-row">
          <label class="editor-find-label" for="ed-replace-input" id="ed-replace-label"></label>
          <input id="ed-replace-input" class="editor-find-input" type="text" spellcheck="false" autocomplete="off" />
          <button id="ed-replace-one" class="editor-btn" type="button"></button>
          <button id="ed-replace-all" class="editor-btn" type="button"></button>
        </div>
      </div>
      <!-- 编辑区 + Markdown 预览（预览开启时左右分栏；窗口较窄时自动上下分栏） -->
      <div id="editor-split" class="editor-split">
        <div id="editor-host" class="editor-host"></div>
        <div id="ed-preview-pane" class="editor-preview" hidden></div>
      </div>
      <footer class="editor-status">
        <span id="ed-ref" class="editor-status-ref"></span>
        <span class="editor-status-mid">
          <span id="ed-mode"></span>
          <span id="ed-eol"></span>
          <span id="ed-pos"></span>
          <span id="ed-size"></span>
        </span>
        <span id="ed-state" class="editor-status-right"></span>
      </footer>
    </div>

    <div id="ed-modal" class="editor-modal" hidden>
      <div class="editor-modal-card">
        <div id="ed-modal-title" class="editor-modal-title"></div>
        <input id="ed-modal-input" class="editor-modal-input" type="text" spellcheck="false" autocomplete="off" />
        <div class="editor-modal-actions">
          <button id="ed-modal-cancel" class="editor-btn" type="button"></button>
          <button id="ed-modal-confirm" class="editor-btn primary" type="button"></button>
        </div>
      </div>
    </div>

    <!-- 意外退出后的恢复提示：按时间列出本地自动保存的副本（最多 5 份） -->
    <div id="ed-recovery" class="editor-modal" hidden>
      <div class="editor-modal-card editor-recovery-card">
        <div id="ed-recovery-title" class="editor-modal-title"></div>
        <div id="ed-recovery-hint" class="editor-recovery-hint"></div>
        <div id="ed-recovery-list" class="editor-recovery-list"></div>
        <div class="editor-modal-actions">
          <button id="ed-recovery-discard" class="editor-btn" type="button"></button>
          <button id="ed-recovery-restore" class="editor-btn primary" type="button"></button>
        </div>
      </div>
    </div>

    <!-- Markdown 图片导出：预览 + 可调宽度 / DPI / 留白，支持复制与下载 -->
    <div id="ed-image-modal" class="editor-modal" hidden>
      <div class="editor-modal-card editor-image-card">
        <div id="ed-image-title" class="editor-modal-title"></div>
        <div class="editor-image-preview">
          <img id="ed-image-preview" alt="" />
          <div id="ed-image-note" class="editor-image-note"></div>
        </div>
        <div class="editor-image-params">
          <label class="editor-image-field">
            <span id="ed-image-width-label"></span>
            <input id="ed-image-width" class="editor-modal-input" type="number" min="200" max="2400" step="10" />
          </label>
          <label class="editor-image-field">
            <span id="ed-image-dpi-label"></span>
            <input id="ed-image-dpi" class="editor-modal-input" type="number" min="72" max="600" step="1" />
          </label>
          <label class="editor-image-field">
            <span id="ed-image-padding-label"></span>
            <input id="ed-image-padding" class="editor-modal-input" type="number" min="0" max="200" step="1" />
          </label>
        </div>
        <div id="ed-image-hint" class="editor-image-hint"></div>
        <div class="editor-modal-actions">
          <button id="ed-image-close" class="editor-btn" type="button"></button>
          <button id="ed-image-download" class="editor-btn" type="button"></button>
          <button id="ed-image-copy" class="editor-btn primary" type="button"></button>
        </div>
      </div>
    </div>

    <script src="./scripts/theme.js"></script>
    <script src="./scripts/constants.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script src="./scripts/ui.js"></script>
    <script src="../../node_modules/codemirror/lib/codemirror.js"></script>
    <script src="../../node_modules/codemirror/addon/edit/matchbrackets.js"></script>
    <script src="../../node_modules/codemirror/addon/edit/closebrackets.js"></script>
    <script src="../../node_modules/codemirror/addon/selection/active-line.js"></script>
    <script src="../../node_modules/codemirror/addon/comment/comment.js"></script>
    <script src="../../node_modules/marked/lib/marked.umd.js"></script>
    <script src="./scripts/file-editor.js"></script>
  </body>
</html>
